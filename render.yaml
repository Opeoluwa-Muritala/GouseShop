services:
  - type: web
    name: gouseshop-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd Backend && pip install -r requirements.txt
    startCommand: cd Backend && python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: GouseShop Backend
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gouseshop-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: USE_FAKE_EXTERNAL_SERVICES
        value: "false"
      - key: USE_FAKE_REDIS
        value: "true"
      - key: PAYMENT_CALLBACK_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_CLIENT_ID
        sync: false
      - key: FLUTTERWAVE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gouseshop
      - key: CLOUDINARY_MAX_UPLOAD_BYTES
        value: "5242880"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false

databases:
  - name: gouseshop-postgres
    databaseName: gouseshop
    user: gouseshop
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
